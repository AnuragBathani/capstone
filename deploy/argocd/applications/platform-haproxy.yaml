# Ingress controller, replacing Traefik. Its Service is type LoadBalancer, so
# this is what provisions the cloud load balancer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: haproxy-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://haproxytech.github.io/helm-charts
    chart: kubernetes-ingress
    targetRevision: 1.44.4
    helm:
      releaseName: haproxy
      values: |
        controller:
          kind: Deployment
          replicaCount: 1
          ingressClassResource:
            name: haproxy
            default: true
          service:
            type: LoadBalancer
            # The AWS Load Balancer Controller provisions an INTERNAL NLB unless
            # told otherwise -- the DNS name resolves but only from inside the VPC,
            # which looks exactly like a broken load balancer from outside.
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
              service.beta.kubernetes.io/aws-load-balancer-type: external
  destination:
    server: https://kubernetes.default.svc
    namespace: haproxy-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
