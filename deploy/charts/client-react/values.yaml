replicaCount: 1

image:
  repository: anuragbathani/devops-directive-docker-course-client-react-nginx
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8080

containerPort: 8080

# nginx proxies /api/* to the backends in-cluster, so the browser talks only to
# this origin. Independent of the ingress-level routing.
backends:
  golang: http://api-golang:8000/
  node: http://api-node:3000/

ingress:
  enabled: true
  className: haproxy
  host: ""
  # Catch-all: everything not matched by a more specific /api/* Ingress.
  path: /

resources:
  limits:
    memory: 100Mi
  requests:
    memory: 100Mi
    cpu: 50m
