{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-react-nginx
  labels:
    {{- include "client-react.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # host is optional on purpose. Left empty the rule matches ANY host, which is
    # what lets you reach the app on the load balancer's own DNS name before you
    # own a domain. Set it once you have real DNS pointing at the LB.
    -
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: client-react-nginx
                port:
                  number: {{ .Values.service.port }}
{{- end }}
