{{- if .Values.dbMigrator.enabled }}
# ⛔️ DONT PUT SECRET FILES IN VCS -- carried over from the course as-is.
# Must exist before the migration Job runs, hence the earlier sync-wave.
apiVersion: v1
kind: Secret
metadata:
  name: db-migrator-password
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
type: Opaque
stringData:
  DATABASE_URL: {{ include "api-golang.databaseUrl" . | quote }}
{{- end }}
