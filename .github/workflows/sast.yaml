name: SAST

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Resolve policy
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
      enforcement: ${{ steps.policy.outputs.enforcement }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Read security policy
        id: policy
        uses: ./.github/actions/security-policy
        with:
          check: sast

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    needs: policy
    if: ${{ needs.policy.outputs.enabled == 'true' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # go.mod pins go 1.19, which CodeQL autobuild no longer handles cleanly.
          # build-mode: none analyses the source directly and sidesteps the toolchain.
          - language: go
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        id: analyze
        if: ${{ !env.ACT }}
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        continue-on-error: ${{ needs.policy.outputs.enforcement != 'block' }}
        with:
          category: "/language:${{ matrix.language }}"

      - name: Summary
        if: ${{ always() }}
        shell: bash
        env:
          LANGUAGE: ${{ matrix.language }}
          ENFORCEMENT: ${{ needs.policy.outputs.enforcement }}
          OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          {
            echo "### SAST — CodeQL (${LANGUAGE})"
            echo ""
            echo "- enforcement: \`${ENFORCEMENT}\`"
            echo "- result: \`${OUTCOME:-skipped}\`"
            echo ""
            echo "Findings are published to **Security → Code scanning**."
          } >> "$GITHUB_STEP_SUMMARY"
