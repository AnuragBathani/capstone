name: Update GitOps Manifests

on:
  workflow_dispatch:
    inputs:
      service:
        required: true
        description: The service to update manifests for
        type: choice
        options:
          - services/go/api-golang
          - services/node/api-node
          # build-push fans out over paths-filter, which pairs the migrator with
          # api-golang via a YAML anchor. Without this option the migrator's
          # "Trigger Depoy" step fails on an invalid choice and reddens that job.
          # The migrator has no config/ of its own, so its run is a clean no-op.
          - services/other/api-golang-migrator
          - services/python/load-generator-python
          - services/react/client-react

      version:
        required: true
        description: The version to update manifests to
        type: string

      environment:
        required: true
        description: The environment to update manifests for
        type: choice
        options:
          - development
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-gitops-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: false

# This job commits back to main, so it needs write access explicitly. Repositories
# default to a read-only GITHUB_TOKEN, under which the push fails with a 403.
permissions:
  contents: write

jobs:
  update-manifests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # utils:git:commit-push rebases onto origin/main before pushing, which
          # needs real history -- the default shallow clone breaks the rebase.
          fetch-depth: 0
          # The main ruleset requires changes to go through a pull request. The
          # default GITHUB_TOKEN pushes as github-actions[bot], which holds no
          # repository role and so matches no bypass entry -- the push is rejected
          # with GH013. checkout persists whatever token it is given and the later
          # `git push` reuses it, so authenticating as the PAT owner (a Repository
          # admin) is what satisfies the bypass list.
          token: ${{ secrets.GHA_CAPSTONE_PERSONAL_ACCESS_TOKEN }}

      - name: Set up Task
        uses: ./.github/actions/setup-dependencies

      # Inputs are passed through env: rather than interpolated into the script.
      # `version` is a free-form string on a job that pushes to main, so inlining
      # it as ${{ }} would let its contents be parsed as shell.
      - name: Generate commit message
        id: generate-commit-msg
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "commit_msg=chore: update ${ENVIRONMENT}, ${SERVICE}, ${VERSION} [skip ci]" >> "$GITHUB_OUTPUT"

      - name: Update GitOps Manifests
        working-directory: ${{ inputs.service }}
        env:
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          task utils:update-image-tags-service \
            NEW_TAG="$VERSION" \
            ENVIRONMENT="$ENVIRONMENT"

      - name: Check diff
        run: |
          git --no-pager diff

      - name: Commit and push changes
        if: ${{ !env.ACT }}
        working-directory: ${{ inputs.service }}
        env:
          COMMIT_MSG: ${{ steps.generate-commit-msg.outputs.commit_msg }}
        run: |
          task utils:git:commit-push \
            COMMIT_MSG="$COMMIT_MSG" \
            BRANCH="main"

      - name: Summary
        if: ${{ always() }}
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "### GitOps manifest update"
            echo ""
            echo "- service: \`${SERVICE}\`"
            echo "- version: \`${VERSION}\`"
            echo "- environment: \`${ENVIRONMENT}\`"
            echo ""
            echo "Marker rewritten: \`# ${ENVIRONMENT}_${SERVICE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
