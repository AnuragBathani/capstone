name: Agent Failure Investigator

on:
  workflow_run:
    workflows:
      - Run Tests
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed Run Tests workflow run ID
        required: true
        type: string
      run_attempt:
        description: Workflow run attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

# Prefer the newest failure on a branch. Publication is idempotent by fingerprint.
concurrency:
  group: agent-investigate-${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  investigate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FAILED_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
      FAILED_RUN_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.run_attempt || github.event.workflow_run.run_attempt }}
      OUTPUT_DIR: agent-output/${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}-${{ github.event_name == 'workflow_dispatch' && inputs.run_attempt || github.event.workflow_run.run_attempt }}

    steps:
      # No ref is supplied: this always runs the trusted default-branch agent.
      # Failed PR code is read as data through the API and is never executed here.
      - name: Checkout trusted agent
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install agent
        run: python -m pip install './agents/devops-ci'

      - name: Investigate failed workflow
        env:
          GH_TOKEN: ${{ secrets.GHA_CAPSTONE_PERSONAL_ACCESS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: >-
          devops-ci investigate
          --run-id "$FAILED_RUN_ID"
          --run-attempt "$FAILED_RUN_ATTEMPT"
          --output-dir "$OUTPUT_DIR"

      - name: Publish investigation
        env:
          GH_TOKEN: ${{ secrets.GHA_CAPSTONE_PERSONAL_ACCESS_TOKEN }}
        run: devops-ci publish --input "$OUTPUT_DIR/investigation.json"

      - name: Upload sanitized investigation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-investigation-${{ env.FAILED_RUN_ID }}-attempt-${{ env.FAILED_RUN_ATTEMPT }}
          path: |
            ${{ env.OUTPUT_DIR }}/investigation.json
            ${{ env.OUTPUT_DIR }}/investigation.md
            ${{ env.OUTPUT_DIR }}/metadata.json
            ${{ env.OUTPUT_DIR }}/tool-trace.json
          if-no-files-found: warn
          retention-days: 7
