name: Build and Push Container Image

on:
    push:
        branches:
          - main
        paths:
          - services/**
        tags:
          - "**@[0-9]*.[0-9]*.[0-9]*"
    workflow_dispatch:
      inputs:
        service:
          description: 'Service to build and push'
          type: choice
          required: true
          options:
            - services/node/api-node
            - services/python/load-generator-python
            - services/go/api-golang
            - services/other/api-golang-migrator
            - services/react/client-react
        version:
          description: 'Version to use for tagging the image'
          required: false
            

jobs:
    filter:
        runs-on: ubuntu-24.04
        outputs:
            services: ${{ steps.set-output.outputs.services }}
            environment: ${{ steps.set-output.outputs.environment }}
        steps:
            - name: Checkout code
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
              with:
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: filter
              id: filter
              if: ${{ github.ref_type != 'tag' }}
              uses: dorny/paths-filter@v4.0.3 # v4 (runtime: Node.js 24)
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                filters: .github/utils/file-filters.yaml
            - name: set-output
              id: set-output
              run: |
                if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                  echo "services=[\"${{ inputs.service }}\"]" >> "$GITHUB_OUTPUT"
                  echo "environment=development" >> $GITHUB_OUTPUT

                elif [[ "${{ github.ref_type }}" == "tag" ]]; then
                  # service/node/api-node
                  tag="${GITHUB_REF_NAME}"
                  svc="${tag%%@*}"
                  echo "services=[\"${svc}\"]" >> "$GITHUB_OUTPUT"
                  echo "environment=production" >> $GITHUB_OUTPUT
                else
                  echo 'services=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
                  echo 'environment=staging' >> "$GITHUB_OUTPUT"
                fi
    build-and-push:
        runs-on: ubuntu-24.04
        needs: filter
        if: ${{ needs.filter.outputs.services != '[]'  &&  needs.filter.outputs.services != '' }}
        permissions:
            actions: write
            contents: read
            security-events: write
        strategy:
          fail-fast: false
          matrix:
            service: ${{ fromJSON(needs.filter.outputs.services || '[]') }}
              # service: ["services/node/api-node"]
        steps:
            - name: Checkout code
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                fetch-depth: 0

            - name: Set up Task
              uses: ./.github/actions/setup-dependencies

            - name: Read security policy
              id: policy
              uses: ./.github/actions/security-policy
              with:
                check: container_scan

            - name: Login to Docker Hub
              if: ${{ !env.ACT }}
              uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 #v3.6.0
            - name : Set up Docker Buildx
              uses: docker/setup-buildx-action@v4 #v3.11.1
            - name: Compute Image tag
              id: image-tag
              working-directory: ${{ matrix.service }}
              env:
                ENVIRONMENT: ${{needs.filter.outputs.environment}}
                INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
                SERVICE: ${{ matrix.service }}
              run: |
                if [[ -n "$INPUT_VERSION" ]]; then
                  version="$INPUT_VERSION"
                  image_tag=$(task utils:manual-version-tag -- $INPUT_VERSION)
                elif [[ "$ENVIRONMENT" == "production" ]]; then
                  version=$(task utils:generate-version -- "$SERVICE")
                  image_tag=$(task utils:generate-version-tag -- "$SERVICE")
                else
                  version=$(task utils:generate-extended-version -- "$SERVICE")
                  image_tag=$(task utils:generate-extended-version-tag -- "$SERVICE")
                fi
                echo "version=${version}" >> $GITHUB_OUTPUT
                echo "image_tag=${image_tag}" >> $GITHUB_OUTPUT

                #TODO: generate actual image tags
                echo "version=${version}" 
                echo "image_tag=${image_tag}"

            # The image is built and loaded locally FIRST so it can be scanned before it
            # ever reaches Docker Hub. Pushing first and scanning after would mean a
            # vulnerable image is already public by the time the finding lands.
            # load: true is safe here because this build is single-platform.
            - name: Build Container Image (local, not pushed)
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 #v6.18.0
              with:
                context: ${{ matrix.service }}
                push: false
                load: true
                tags: ${{ steps.image-tag.outputs.image_tag }}
                platforms: linux/amd64
                cache-from: type=gha
                cache-to: type=gha,mode=max

            - name: Scan Image with Trivy (report)
              if: ${{ steps.policy.outputs.enabled == 'true' }}
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                # Under act there is no valid github.token, so setup-trivy's internal
                # actions/checkout of aquasecurity/trivy cannot authenticate. Locally we
                # use the trivy already baked into the runner image; on GitHub this is 'false'.
                skip-setup-trivy: ${{ env.ACT && 'true' || 'false' }}
                scan-type: image
                image-ref: ${{ steps.image-tag.outputs.image_tag }}
                format: sarif
                output: trivy-image.sarif
                severity: ${{ steps.policy.outputs.severity }}
                ignore-unfixed: true
                trivyignores: .trivyignore
                exit-code: "0"

            - name: Upload SARIF to Code Scanning
              if: ${{ steps.policy.outputs.enabled == 'true' && !env.ACT }}
              uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
              with:
                sarif_file: trivy-image.sarif
                category: trivy-image-${{ matrix.service }}

            # The gate. Non-zero exit here stops the push step below from running.
            - name: Scan Image with Trivy (gate)
              if: ${{ steps.policy.outputs.enabled == 'true' }}
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                # Under act there is no valid github.token, so setup-trivy's internal
                # actions/checkout of aquasecurity/trivy cannot authenticate. Locally we
                # use the trivy already baked into the runner image; on GitHub this is 'false'.
                skip-setup-trivy: ${{ env.ACT && 'true' || 'false' }}
                scan-type: image
                image-ref: ${{ steps.image-tag.outputs.image_tag }}
                format: table
                severity: ${{ steps.policy.outputs.severity }}
                ignore-unfixed: true
                trivyignores: .trivyignore
                exit-code: ${{ steps.policy.outputs.exit_code }}

            - name: Push Container Image
              if: ${{ !env.ACT }}
              env:
                IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
              run: |
                docker push "$IMAGE_TAG"

            - name: Container scan summary
              if: ${{ always() }}
              env:
                SERVICE: ${{ matrix.service }}
                IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
                ENABLED: ${{ steps.policy.outputs.enabled }}
                ENFORCEMENT: ${{ steps.policy.outputs.enforcement }}
                SEVERITY: ${{ steps.policy.outputs.severity }}
              run: |
                {
                  echo "### Container Scan — ${SERVICE}"
                  echo ""
                  echo "- image: \`${IMAGE_TAG}\`"
                  echo "- gate enabled: \`${ENABLED}\`"
                  echo "- enforcement: \`${ENFORCEMENT}\` at \`${SEVERITY}\`"
                  echo ""
                  echo "Image is pushed only after the gate passes."
                } >> "$GITHUB_STEP_SUMMARY"

            - name: Trigger Depoy
              if: ${{ !env.ACT }}
              env:
                GH_TOKEN: ${{ secrets.GHA_CAPSTONE_PERSONAL_ACCESS_TOKEN }}
              run: |
                    gh workflow run .github/workflows/update-gitops-manifests.yaml \
                        -f service=${{ matrix.service }} \
                        -f version=${{ steps.image-tag.outputs.version }} \
                        -f environment=${{ needs.filter.outputs.environment }}


            


            