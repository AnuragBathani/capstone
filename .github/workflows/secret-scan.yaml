name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Resolve policy
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
      enforcement: ${{ steps.policy.outputs.enforcement }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Read security policy
        id: policy
        uses: ./.github/actions/security-policy
        with:
          check: secret_scan

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    needs: policy
    if: ${{ needs.policy.outputs.enabled == 'true' }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: ${{ needs.policy.outputs.enforcement != 'block' }}
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GHA_CAPSTONE_PERSONAL_ACCESS_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: ${{ github.actor == 'nektos/act' && 'false' || 'true' }}
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_VERSION: 8.24.2

      - name: Summary
        if: ${{ always() }}
        shell: bash
        env:
          ENFORCEMENT: ${{ needs.policy.outputs.enforcement }}
          OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          {
            echo "### Secret Scan — Gitleaks"
            echo ""
            echo "- enforcement: \`${ENFORCEMENT}\`"
            echo "- result: \`${OUTCOME:-skipped}\`"
          } >> "$GITHUB_STEP_SUMMARY"
